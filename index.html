<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BIZTOP — Eng yaxshi bizneslarni toping</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    overflow-x:hidden;
}

body{
    font-family:Arial,sans-serif;
    background:#071a3a;
    color:white;
}

header{
    min-height:72px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:12px 40px;
    border-bottom:2px solid #123d78;
    gap:20px;
}

.logo{
    font-size:42px;
    font-weight:900;
    white-space:nowrap;
}

.logo-blue,.blue{
    color:#2188ff;
}

.add-business-button{
    border:0;
    background:#2188ff;
    color:white;
    padding:14px 20px;
    border-radius:13px;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

.hero{
    text-align:center;
    padding:60px 20px 35px;
}

.hero h1{
    font-size:52px;
    line-height:1.15;
    margin-bottom:22px;
}

.hero p{
    font-size:22px;
    color:#b8c9e8;
    line-height:1.5;
}

.search-box{
    width:100%;
    max-width:800px;
    margin:35px auto 0;
}

#searchInput{
    width:100%;
    height:68px;
    border:0;
    border-radius:18px;
    padding:0 22px;
    font-size:20px;
    outline:none;
}

#searchButton{
    width:100%;
    height:62px;
    margin-top:12px;
    border:0;
    border-radius:18px;
    background:#2188ff;
    color:white;
    font-size:21px;
    font-weight:bold;
    cursor:pointer;
}

.container{
    width:100%;
    max-width:1150px;
    margin:auto;
    padding:10px 25px 60px;
}

.section-title{
    font-size:38px;
    margin:45px 0 25px;
}

.categories{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:14px;
}

.category{
    background:#163663;
    border:2px solid #21589c;
    border-radius:18px;
    min-height:135px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    cursor:pointer;
    transition:.2s;
    padding:12px;
}

.category:hover{
    border-color:#2188ff;
    transform:translateY(-3px);
}

.category-icon{
    font-size:42px;
    margin-bottom:9px;
}

.category h3{
    font-size:17px;
}

#results{
    display:none;
}

.results-info{
    color:#b8c9e8;
    font-size:19px;
    margin-bottom:18px;
}

.business-list{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:18px;
}

.business-card{
    background:#163663;
    border:2px solid #21589c;
    border-radius:20px;
    padding:22px;
}

.business-icon{
    font-size:48px;
    margin-bottom:10px;
}

.business-card h3{
    font-size:23px;
    margin-bottom:10px;
}

.business-info{
    color:#d4e1f7;
    font-size:17px;
    line-height:1.6;
}

.rating{
    color:#ffd32a;
    font-size:20px;
    margin:12px 0;
}

.view-button{
    width:100%;
    height:52px;
    border:0;
    border-radius:13px;
    background:#2188ff;
    color:white;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

.no-results{
    grid-column:1/-1;
    background:#163663;
    border:2px solid #21589c;
    border-radius:18px;
    padding:30px;
    text-align:center;
    font-size:19px;
    color:#b8c9e8;
}

footer{
    text-align:center;
    border-top:2px solid #123d78;
    padding:35px 15px;
    color:#9fb4d8;
}

/* MODAL */

.modal{
    display:none;
    position:fixed;
    z-index:9999;
    inset:0;
    background:rgba(0,0,0,.82);
    padding:15px;
    overflow:auto;
}

.modal-box{
    width:100%;
    max-width:600px;
    margin:45px auto;
    background:#1b4175;
    border:2px solid #2188ff;
    border-radius:23px;
    padding:28px;
    position:relative;
}

.close{
    position:absolute;
    right:16px;
    top:5px;
    font-size:38px;
    cursor:pointer;
}

.modal-box h2{
    font-size:30px;
    margin-bottom:20px;
    padding-right:35px;
}

.modal-info{
    font-size:18px;
    color:#e2ebfa;
    line-height:1.8;
}

.modal-rating{
    color:#ffd32a;
    font-size:23px;
    margin:15px 0;
}

.phone-button{
    display:block;
    width:100%;
    text-align:center;
    text-decoration:none;
    background:#2188ff;
    color:white;
    padding:15px;
    border-radius:14px;
    font-size:19px;
    font-weight:bold;
}

/* FORM */

.form-group{
    margin-bottom:16px;
}

.form-group label{
    display:block;
    margin-bottom:7px;
    font-weight:bold;
}

.form-group input,
.form-group select,
.form-group textarea{
    width:100%;
    border:0;
    border-radius:11px;
    padding:13px;
    font-size:16px;
    outline:none;
    font-family:Arial,sans-serif;
}

.form-group textarea{
    min-height:90px;
    resize:vertical;
}

.submit-business,
.cancel-button{
    width:100%;
    border:0;
    border-radius:12px;
    padding:14px;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

.submit-business{
    background:#2188ff;
    color:white;
}

.cancel-button{
    background:#304f78;
    color:white;
    margin-top:9px;
}

.form-message{
    display:none;
    background:#174f38;
    border:1px solid #35c47c;
    padding:11px;
    border-radius:9px;
    margin-bottom:15px;
    text-align:center;
}

/* TABLET */

@media(max-width:900px){

    .categories{
        grid-template-columns:repeat(3,1fr);
    }

    .business-list{
        grid-template-columns:repeat(2,1fr);
    }
}

/* TELEFON */

@media(max-width:600px){

    header{
        padding:10px 14px;
    }

    .logo{
        font-size:32px;
    }

    .add-business-button{
        padding:10px 12px;
        font-size:13px;
    }

    .hero{
        padding:40px 15px 25px;
    }

    .hero h1{
        font-size:32px;
    }

    .hero p{
        font-size:17px;
    }

    #searchInput{
        height:60px;
        font-size:16px;
    }

    #searchButton{
        height:57px;
        font-size:19px;
    }

    .container{
        padding:5px 13px 45px;
    }

    .section-title{
        font-size:28px;
        margin:35px 0 18px;
    }

    .categories{
        grid-template-columns:repeat(2,1fr);
        gap:10px;
    }

    .category{
        min-height:125px;
    }

    .category-icon{
        font-size:36px;
    }

    .category h3{
        font-size:15px;
    }

    .business-list{
        grid-template-columns:1fr;
    }

    .business-card{
        padding:20px;
    }
}
</style>
</head>

<body>

<header>

<div class="logo">
<span class="logo-blue">BIZ</span>TOP
</div>

<button
class="add-business-button"
id="openAddBusiness">
➕ Biznes qo‘shish
</button>

</header>


<section class="hero">

<h1>
Eng yaxshi<br>
<span class="blue">bizneslarni</span> toping
</h1>

<p>
BIZTOP — bizneslarni topish,<br>
baholash va tanlash platformasi.
</p>

<div class="search-box">

<input
id="searchInput"
type="text"
placeholder="Restoran, kafe, game club yoki boshqa..."
>

<button id="searchButton">
🔎 Qidirish
</button>

</div>

</section>


<main class="container">

<section id="categorySection">

<h2 class="section-title">
Kategoriyalar
</h2>

<div class="categories" id="categories"></div>

</section>


<section id="results">

<h2 class="section-title">
🔎 Qidiruv natijalari
</h2>

<div
id="resultsInfo"
class="results-info">
</div>

<div
id="businessList"
class="business-list">
</div>

</section>


<section id="popular">

<h2 class="section-title">
🏆 Mashhur bizneslar
</h2>

<div
id="popularList"
class="business-list">
</div>

</section>

</main>


<footer>
© 2026 BIZTOP — Bizneslarni toping va baholang.
</footer>


<!-- BIZNES KO‘RISH -->

<div
id="businessModal"
class="modal">

<div class="modal-box">

<span
class="close"
id="closeModal">
×
</span>

<h2 id="modalName"></h2>

<div
id="modalInfo"
class="modal-info">
</div>

<div
id="modalRating"
class="modal-rating">
</div>

<a
id="modalPhone"
class="phone-button"
href="#">
📞 Telefon qilish
</a>

</div>
</div>


<!-- BIZNES QO‘SHISH -->

<div
id="addBusinessModal"
class="modal">

<div class="modal-box">

<span
class="close"
id="closeAddBusiness">
×
</span>

<h2>➕ Biznes qo‘shish</h2>

<div
id="formMessage"
class="form-message">
✅ Biznes muvaffaqiyatli qo‘shildi!
</div>

<form id="businessForm">

<div class="form-group">
<label>Biznes nomi *</label>

<input
id="newName"
type="text"
placeholder="Masalan: Jahongir Restaurant"
required>
</div>


<div class="form-group">
<label>Kategoriya *</label>

<select
id="newCategory"
required>

<option value="">
Kategoriyani tanlang
</option>

</select>
</div>


<div class="form-group">
<label>Manzil *</label>

<input
id="newLocation"
type="text"
placeholder="Masalan: To‘rtko‘l"
required>
</div>


<div class="form-group">
<label>Telefon *</label>

<input
id="newPhone"
type="tel"
placeholder="+998 90 123 45 67"
required>
</div>


<div class="form-group">
<label>Biznes haqida</label>

<textarea
id="newDescription"
placeholder="Biznes haqida qisqacha ma'lumot...">
</textarea>
</div>


<button
type="submit"
class="submit-business">
✅ Biznesni qo‘shish
</button>

<button
type="button"
class="cancel-button"
id="cancelAddBusiness">
Bekor qilish
</button>

</form>

</div>
</div>


<script>

/* =========================
   50 TA KATEGORIYA
========================= */

const categories = [

["🍽️","Restoran"],
["☕","Kafe"],
["🛒","Do‘kon"],
["👕","Kiyim-kechak"],
["👟","Poyabzal"],
["📱","Telefon va elektronika"],
["🛋️","Mebel"],
["🥩","Go‘sht do‘koni"],
["🥖","Nonvoyxona"],
["🌾","Qishloq xo‘jaligi"],
["🐄","Chorvachilik"],

["🍕","Fast Food"],
["🍰","Qandolat"],
["🎮","Game Club"],
["🎳","Ko‘ngilochar markaz"],

["🏨","Mehmonxona"],
["🧳","Turizm"],
["🚕","Taksi"],
["🚗","Avtomobil ijarasi"],

["🔧","Avtoservis"],
["🛞","Shina va vulkanizatsiya"],
["🚘","Avtoyuvish"],
["🔩","Avto ehtiyot qismlar"],

["💇","Sartaroshxona"],
["💅","Go‘zallik saloni"],
["🧹","Tozalash xizmatlari"],
["🔧","Maishiy xizmatlar"],
["📦","Yetkazib berish"],

["🏗️","Qurilish"],
["🧱","Qurilish materiallari"],
["🪟","Deraza va eshiklar"],
["🔌","Elektr xizmatlari"],
["🚿","Santexnika"],
["🎨","Remont va dizayn"],

["🎓","O‘quv markazi"],
["💻","IT kurslari"],
["🗣️","Til kurslari"],
["🏋️","Sport zali"],
["⚽","Sport markazi"],

["💊","Dorixona"],
["🏥","Klinika"],
["🦷","Stomatologiya"],
["👓","Optika"],

["💻","IT xizmatlari"],
["📸","Foto/video xizmatlari"],
["⚖️","Huquqiy xizmatlar"],
["📊","Buxgalteriya"],
["💰","Moliya xizmatlari"],
["📢","Reklama xizmatlari"],
["🖨️","Poligrafiya"]

];


/* =========================
   BOSHLANG‘ICH BIZNESLAR
========================= */

const businesses = [

{
name:"BIZTOP Burger",
icon:"🍔",
location:"To‘rtko‘l",
category:"Restoran",
rating:"★★★★★ 4.9",
phone:"+998901234567",
description:"Mazali burger va tez tayyorlanadigan taomlar."
},

{
name:"Top Coffee",
icon:"☕",
location:"To‘rtko‘l",
category:"Kafe",
rating:"★★★★★ 4.8",
phone:"+998901234568",
description:"Qahva, shirinliklar va yoqimli muhit."
},

{
name:"To‘rtko‘l Pizza",
icon:"🍕",
location:"To‘rtko‘l",
category:"Restoran",
rating:"★★★★☆ 4.5",
phone:"+998901234569",
description:"Pizza va boshqa mazali taomlar."
},

{
name:"Sweet Cafe",
icon:"🍰",
location:"To‘rtko‘l",
category:"Kafe",
rating:"★★★★★ 4.9",
phone:"+998901234570",
description:"Shirinliklar va issiq ichimliklar."
},

{
name:"BIZTOP Market",
icon:"🛒",
location:"To‘rtko‘l",
category:"Do‘kon",
rating:"★★★★★ 4.7",
phone:"+998901234571",
description:"Kundalik oziq-ovqat va uy-ro‘zg‘or mahsulotlari."
},

{
name:"Turtkul Hotel",
icon:"🏨",
location:"To‘rtko‘l",
category:"Mehmonxona",
rating:"★★★★☆ 4.4",
phone:"+998901234572",
description:"Mehmonlar uchun qulay xonalar."
},

{
name:"BIZTOP Auto",
icon:"🚗",
location:"To‘rtko‘l",
category:"Avtoservis",
rating:"★★★★★ 4.8",
phone:"+998901234573",
description:"Avtomobillarga texnik xizmat ko‘rsatish."
},

{
name:"Mega Qurilish",
icon:"🏗️",
location:"To‘rtko‘l",
category:"Qurilish",
rating:"★★★★☆ 4.6",
phone:"+998901234574",
description:"Qurilish materiallari va xizmatlar."
},

{
name:"Game Zone",
icon:"🎮",
location:"To‘rtko‘l",
category:"Game Club",
rating:"★★★★★ 4.9",
phone:"+998901234575",
description:"PlayStation, kompyuter va zamonaviy o‘yinlar."
}

];


/* =========================
   ELEMENTLAR
========================= */

const categoryBox =
document.getElementById("categories");

const searchInput =
document.getElementById("searchInput");

const searchButton =
document.getElementById("searchButton");

const results =
document.getElementById("results");

const resultsInfo =
document.getElementById("resultsInfo");

const businessList =
document.getElementById("businessList");

const popularList =
document.getElementById("popularList");

const categorySection =
document.getElementById("categorySection");

const popularSection =
document.getElementById("popular");


/* =========================
   KATEGORIYALARNI CHIQARISH
========================= */

categories.forEach(function(item){

const div =
document.createElement("div");

div.className =
"category";

div.setAttribute(
"data-category",
item[1]
);

div.innerHTML = `
<div class="category-icon">${item[0]}</div>
<h3>${item[1]}</h3>
`;

div.addEventListener(
"click",
function(){

searchInput.value =
item[1];

searchBusiness();

window.scrollTo({
top:0,
behavior:"smooth"
});

});

categoryBox.appendChild(div);

});


/* =========================
   FORM KATEGORIYALARI
========================= */

const newCategory =
document.getElementById("newCategory");

categories.forEach(function(item){

const option =
document.createElement("option");

option.value =
item[1];

option.textContent =
item[0] + " " + item[1];

newCategory.appendChild(option);

});


/* =========================
   KARTA YARATISH
========================= */

function createBusinessCard(business){

return `

<div class="business-card">

<div class="business-icon">
${business.icon}
</div>

<h3>
${business.name}
</h3>

<div class="business-info">
📍 ${business.location}<br>
🏪 ${business.category}
</div>

<div class="rating">
${business.rating}
</div>

<button
class="view-button"
data-name="${business.name}">
Ko‘rish
</button>

</div>

`;

}


/* =========================
   KO‘RISH TUGMALARI
========================= */

function addViewEvents(){

document
.querySelectorAll(".view-button")
.forEach(function(button){

button.addEventListener(
"click",
function(){

const name =
button.getAttribute("data-name");

const business =
businesses.find(
function(item){
return item.name === name;
});

if(business){
openBusinessModal(business);
}

});

});

}


/* =========================
   MASHHUR BIZNESLAR
========================= */

function showPopular(){

popularList.innerHTML = "";

businesses.forEach(
function(business){

popularList.innerHTML +=
createBusinessCard(business);

});

addViewEvents();

}


/* =========================
   QIDIRUV
========================= */

function searchBusiness(){

const query =
searchInput.value
.trim()
.toLowerCase();

if(query === ""){

results.style.display =
"none";

categorySection.style.display =
"block";

popularSection.style.display =
"block";

return;
}


const found =
businesses.filter(
function(business){

return (

business.name
.toLowerCase()
.includes(query)

||

business.location
.toLowerCase()
.includes(query)

||

business.category
.toLowerCase()
.includes(query)

);

});


results.style.display =
"block";

categorySection.style.display =
"none";

popularSection.style.display =
"none";


resultsInfo.innerHTML =
`"${searchInput.value}" bo‘yicha ${found.length} ta natija topildi`;

businessList.innerHTML = "";


if(found.length === 0){

businessList.innerHTML = `

<div class="no-results">

😔 Biznes topilmadi.

<br><br>

Boshqa nom yoki kategoriya
bilan qidirib ko‘ring.

</div>

`;

return;

}


found.forEach(
function(business){

businessList.innerHTML +=
createBusinessCard(business);

});

addViewEvents();

}


searchButton.addEventListener(
"click",
searchBusiness
);


searchInput.addEventListener(
"keydown",
function(event){

if(event.key === "Enter"){
searchBusiness();
}

});


/* =========================
   BIZNES KO‘RISH MODALI
========================= */

const businessModal =
document.getElementById("businessModal");

const modalName =
document.getElementById("modalName");

const modalInfo =
document.getElementById("modalInfo");

const modalRating =
document.getElementById("modalRating");

const modalPhone =
document.getElementById("modalPhone");

const closeModal =
document.getElementById("closeModal");


function openBusinessModal(business){

modalName.innerHTML =
business.icon + " " + business.name;

modalInfo.innerHTML = `
📍 ${business.location}<br>
🏪 ${business.category}<br>
📝 ${business.description}
`;

modalRating.innerHTML =
business.rating;

modalPhone.href =
"tel:" + business.phone;

businessModal.style.display =
"block";

}


closeModal.addEventListener(
"click",
function(){

businessModal.style.display =
"none";

});


/* =========================
   BIZNES QO‘SHISH
========================= */

const addBusinessModal =
document.getElementById(
"addBusinessModal"
);

const openAddBusiness =
document.getElementById(
"openAddBusiness"
);

const closeAddBusiness =
document.getElementById(
"closeAddBusiness"
);

const cancelAddBusiness =
document.getElementById(
"cancelAddBusiness"
);

const businessForm =
document.getElementById(
"businessForm"
);

const formMessage =
document.getElementById(
"formMessage"
);


openAddBusiness.addEventListener(
"click",
function(){

addBusinessModal.style.display =
"block";

});


closeAddBusiness.addEventListener(
"click",
function(){

addBusinessModal.style.display =
"none";

});


cancelAddBusiness.addEventListener(
"click",
function(){

addBusinessModal.style.display =
"none";

});


/* =========================
   YANGI BIZNES QO‘SHISH
========================= */

businessForm.addEventListener(
"submit",
function(event){

event.preventDefault();


const name =
document
.getElementById("newName")
.value.trim();

const category =
document
.getElementById("newCategory")
.value;

const location =
document
.getElementById("newLocation")
.value.trim();

const phone =
document
.getElementById("newPhone")
.value.trim();

const description =
document
.getElementById("newDescription")
.value.trim();


if(
!name ||
!category ||
!location ||
!phone
){
return;
}


const selected =
categories.find(
function(item){
return item[1] === category;
});


const newBusiness = {

name:name,

icon:
selected ?
selected[0] :
"🏪",

location:location,

category:category,

rating:"★★★★★ Yangi",

phone:phone,

description:
description ||
"Biznes haqida ma’lumot hozircha kiritilmagan."

};


businesses.unshift(
newBusiness
);


showPopular();

businessForm.reset();

formMessage.style.display =
"block";


setTimeout(
function(){

formMessage.style.display =
"none";

addBusinessModal.style.display =
"none";

},
1200
);

});


/* =========================
   MODAL TASHQARISINI BOSISH
========================= */

window.addEventListener(
"click",
function(event){

if(
event.target === businessModal
){

businessModal.style.display =
"none";

}

if(
event.target === addBusinessModal
){

addBusinessModal.style.display =
"none";

}

});


/* =========================
   BOSHLANG‘ICH HOLAT
========================= */

showPopular();

</script>

</body>
