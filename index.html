<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    width:100%;
    overflow-x:hidden;
}

body{
    width:100%;
    overflow-x:hidden;
    font-family:Arial,sans-serif;
    background:#071a3a;
    color:#fff;
}

/* HEADER */

header{
    min-height:72px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:12px 40px;
    border-bottom:2px solid #123d78;
    gap:20px;
}

.logo{
    font-size:42px;
    font-weight:900;
    white-space:nowrap;
}

.logo-blue{
    color:#2188ff;
}

.logo-white{
    color:#fff;
}

.add-business-button{
    border:none;
    background:#2188ff;
    color:white;
    padding:14px 20px;
    border-radius:13px;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

.add-business-button:active{
    transform:scale(.97);
}

/* HERO */

.hero{
    text-align:center;
    padding:65px 20px 35px;
}

.hero h1{
    font-size:52px;
    line-height:1.15;
    margin-bottom:22px;
}

.blue{
    color:#2188ff;
}

.hero p{
    font-size:23px;
    color:#b8c9e8;
    line-height:1.45;
    max-width:800px;
    margin:auto;
}

/* SEARCH */

.search-box{
    width:100%;
    max-width:800px;
    margin:40px auto 0;
}

#searchInput{
    width:100%;
    height:75px;
    border:none;
    border-radius:20px;
    padding:0 25px;
    font-size:21px;
    outline:none;
}

#searchButton{
    width:100%;
    height:70px;
    margin-top:15px;
    border:none;
    border-radius:20px;
    background:#2188ff;
    color:#fff;
    font-size:23px;
    font-weight:bold;
    cursor:pointer;
}

/* CONTAINER */

.container{
    width:100%;
    max-width:1100px;
    margin:auto;
    padding:15px 35px 70px;
}

.section-title{
    font-size:42px;
    margin:60px 0 30px;
}

/* =========================
   KATEGORIYALAR
========================= */

.categories{
    display:grid;

    /* 2 QATOR */
    grid-template-rows:repeat(2,150px);

    /* HAR BIR USTUNNING KENGLIGI */
    grid-auto-columns:220px;

    /* USTUNLAR CHAPDAN O‘NGGA */
    grid-auto-flow:column;

    gap:15px;

    width:100%;

    overflow-x:auto;
    overflow-y:hidden;

    padding:5px 5px 15px;

    scroll-behavior:smooth;

    -webkit-overflow-scrolling:touch;
}

/* SCROLL CHIZIG‘I */

.categories::-webkit-scrollbar{
    height:7px;
}

.categories::-webkit-scrollbar-track{
    background:#0d2852;
    border-radius:10px;
}

.categories::-webkit-scrollbar-thumb{
    background:#2188ff;
    border-radius:10px;
}

/* CATEGORY */

.category{
    width:220px;
    height:150px;

    background:#163663;
    border:2px solid #21589c;

    border-radius:23px;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    cursor:pointer;

    transition:.2s;

    user-select:none;
}

.category:hover{
    border-color:#2188ff;
    transform:translateY(-4px);
}

.category:active{
    transform:scale(.97);
}

.category-icon{
    font-size:48px;
    margin-bottom:10px;
}

.category h3{
    font-size:21px;
    text-align:center;
}

/* RESULTS */

#results{
    display:none;
}

.results-info{
    font-size:21px;
    color:#b8c9e8;
    margin-bottom:20px;
}

.business-list{
    display:grid;
    gap:25px;
}

/* BUSINESS CARD */

.business-card{
    background:#163663;
    border:2px solid #21589c;
    border-radius:27px;
    padding:30px;
}

.business-icon{
    font-size:60px;
    margin-bottom:12px;
}

.business-card h3{
    font-size:32px;
    margin-bottom:14px;
}

.business-info{
    font-size:21px;
    color:#d4e1f7;
    line-height:1.7;
}

.rating{
    color:#ffd32a;
    font-size:25px;
    margin:17px 0;
}

.view-button{
    width:100%;
    height:62px;
    border:none;
    border-radius:17px;
    background:#2188ff;
    color:#fff;
    font-size:22px;
    font-weight:bold;
    cursor:pointer;
}

.view-button:active{
    transform:scale(.98);
}

/* NO RESULTS */

.no-results{
    background:#163663;
    border:2px solid #21589c;
    border-radius:23px;
    padding:30px;
    text-align:center;
    font-size:21px;
    color:#b8c9e8;
}

/* FOOTER */

footer{
    text-align:center;
    border-top:2px solid #123d78;
    padding:45px 20px;
    color:#9fb4d8;
    font-size:19px;
}

/* =========================
   MODAL
========================= */

.modal{
    display:none;

    position:fixed;

    z-index:9999;

    left:0;
    top:0;

    width:100%;
    height:100%;

    background:rgba(0,0,0,.82);

    padding:20px;

    overflow:auto;
}

.modal-box{
    width:100%;
    max-width:650px;

    margin:60px auto;

    background:#1b4175;

    border:3px solid #2188ff;

    border-radius:27px;

    padding:35px;

    position:relative;
}

.close{
    position:absolute;

    right:20px;
    top:10px;

    font-size:42px;

    cursor:pointer;
}

.modal-box h2{
    font-size:39px;
    margin-bottom:25px;
    padding-right:45px;
}

.modal-info{
    font-size:22px;
    color:#e2ebfa;
    line-height:1.8;
}

.modal-rating{
    color:#ffd32a;
    font-size:27px;
    margin:20px 0;
}

.phone-button{
    display:block;

    width:100%;

    text-align:center;

    text-decoration:none;

    background:#2188ff;

    color:#fff;

    padding:18px;

    border-radius:17px;

    font-size:22px;

    font-weight:bold;
}

/* =========================
   BIZNES QO‘SHISH
========================= */

.form-group{
    margin-bottom:18px;
}

.form-group label{
    display:block;
    margin-bottom:8px;
    font-size:17px;
    font-weight:bold;
}

.form-group input,
.form-group select,
.form-group textarea{
    width:100%;

    border:none;

    border-radius:12px;

    padding:14px;

    font-size:17px;

    outline:none;

    font-family:Arial,sans-serif;
}

.form-group textarea{
    min-height:100px;
    resize:vertical;
}

.submit-business{
    width:100%;

    border-radius:13px;

    background:#2188ff;

    color:white;

    padding:16px;

    font-size:19px;

    font-weight:bold;

    cursor:pointer;

    margin-top:5px;

.cancel-button{

    background:#304f78;

    color:white;

    padding:14px;

    font-size:17px;

    font-weight:bold;

    cursor:pointer;

    margin-top:10px;

.form-message{

    border:1px solid #35c47c;

    color:#fff;

    padding:12px;

    border-radius:10px;

    margin-bottom:18px;

    text-align:center;

                🏪 ${business.category}

            </div>

            <div class="rating">
                ${business.rating}
            </div>

            <button
                class="view-button"
                data-name="${business.name}"
            >
                Ko‘rish
            </button>

        </div>

    `;

}


/* =========================
   MASHHUR BIZNESLAR
========================= */

function showPopular(){

    popularList.innerHTML = "";

    businesses.forEach(
        function(business){

            popularList.innerHTML +=
                createBusinessCard(
                    business
                );

        }
    );

    addViewEvents();

}


/* =========================
   QIDIRUV
========================= */

function searchBusiness(){

    const query =
        searchInput.value
        .trim()
        .toLowerCase();


    if(query === ""){

        results.style.display =
            "none";

        categorySection.style.display =
            "block";

        popularSection.style.display =
            "block";

        return;

    }


    const found =
        businesses.filter(
            function(business){

                return (

                    business.name
                    .toLowerCase()
                    .includes(query)

                    ||

                    business.location
                    .toLowerCase()
                    .includes(query)

                    ||

                    business.category
                    .toLowerCase()
                    .includes(query)

                );

            }
        );


    results.style.display =
        "block";

    categorySection.style.display =
        "none";

    popularSection.style.display =
        "none";


    resultsInfo.innerHTML =
        `"${searchInput.value}" bo‘yicha ${found.length} ta natija topildi`;


    businessList.innerHTML = "";


    if(found.length === 0){

        businessList.innerHTML = `

            <div class="no-results">

                😔 Biznes topilmadi.

                <br><br>

                Boshqa nom yoki kategoriya
                bilan qidirib ko‘ring.

            </div>

        `;

        return;

    }


    found.forEach(
        function(business){

            businessList.innerHTML +=
                createBusinessCard(
                    business
                );

        }
    );


    addViewEvents();

}


/* SEARCH BUTTON */

searchButton.addEventListener(
    "click",
    searchBusiness
);


/* ENTER */

searchInput.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Enter"){

            searchBusiness();

        }

    }
);


/* =========================
   KATEGORIYA BOSISH
========================= */

document
.querySelectorAll(".category")
.forEach(
    function(category){

        category.addEventListener(
            "click",
            function(){

                const selectedCategory =
                    category.getAttribute(
                        "data-category"
                    );

                searchInput.value =
                    selectedCategory;

                searchBusiness();

                window.scrollTo({

                    top:0,

                    behavior:"smooth"

                });

            }
        );

    }
);


/* =========================
   VIEW BUTTON
========================= */

function addViewEvents(){

    document
    .querySelectorAll(".view-button")
    .forEach(
        function(button){

            button.addEventListener(
                "click",
                function(){

                    const name =
                        button.getAttribute(
                            "data-name"
                        );


                    const business =
                        businesses.find(
                            function(item){

                                return item.name === name;

                            }
                        );


                    if(!business){

                        return;

                    }


                    openBusinessModal(
                        business
                    );

                }
            );

        }
    );

}


/* =========================
   BUSINESS MODAL
========================= */

const businessModal =
    document.getElementById(
        "businessModal"
    );

const modalName =
    document.getElementById(
        "modalName"
    );

const modalInfo =
    document.getElementById(
        "modalInfo"
    );

const modalRating =
    document.getElementById(
        "modalRating"
    );

const modalPhone =
    document.getElementById(
        "modalPhone"
    );

const closeModal =
    document.getElementById(
        "closeModal"
    );


function openBusinessModal(
    business
){

    modalName.innerHTML =
        business.icon +
        " " +
        business.name;


    modalInfo.innerHTML = `

        📍 ${business.location}

        <br>

        🏪 ${business.category}

        <br>

        📝 ${business.description}

    `;


    modalRating.innerHTML =
        business.rating;


    modalPhone.href =
        "tel:" +
        business.phone;


    businessModal.style.display =
        "block";

}


/* CLOSE */

closeModal.addEventListener(
    "click",
    function(){

        businessModal.style.display =
            "none";

    }
);


/* =========================
   BIZNES QO‘SHISH
========================= */

const addBusinessModal =
    document.getElementById(
        "addBusinessModal"
    );

const openAddBusiness =
    document.getElementById(
        "openAddBusiness"
    );

const closeAddBusiness =
    document.getElementById(
        "closeAddBusiness"
    );

const cancelAddBusiness =
    document.getElementById(
        "cancelAddBusiness"
    );

const businessForm =
    document.getElementById(
        "businessForm"
    );

const formMessage =
    document.getElementById(
        "formMessage"
    );

const newCategory =
    document.getElementById(
        "newCategory"
    );


/* =========================
   SELECT KATEGORIYALARI
========================= */

categories.forEach(
    function(category){

        const option =
            document.createElement(
                "option"
            );

        option.value =
            category.name;

        option.textContent =
            category.icon +
            " " +
            category.name;

        newCategory.appendChild(
            option
        );

    }
);


/* OPEN */

openAddBusiness.addEventListener(
    "click",
    function(){

        addBusinessModal.style.display =
            "block";

    }
);


/* CLOSE */

closeAddBusiness.addEventListener(
    "click",
    function(){

        addBusinessModal.style.display =
            "none";

    }
);


/* CANCEL */

cancelAddBusiness.addEventListener(
    "click",
    function(){

        addBusinessModal.style.display =
            "none";

    }
);


/* =========================
   YANGI BIZNES QO‘SHISH
========================= */

businessForm.addEventListener(
    "submit",
    function(event){

        event.preventDefault();


        const name =
            document.getElementById(
                "newName"
            ).value.trim();


        const category =
            document.getElementById(
                "newCategory"
            ).value;


        const location =
            document.getElementById(
                "newLocation"
            ).value.trim();


        const phone =
            document.getElementById(
                "newPhone"
            ).value.trim();


        const description =
            document.getElementById(
                "newDescription"
            ).value.trim();


        if(
            !name ||
            !category ||
            !location ||
            !phone
        ){

            return;

        }


        const selected =
            categories.find(
                function(item){

                    return item.name === category;

                }
            );


        const newBusiness = {

            name:name,

            icon:
                selected
                ? selected.icon
                : "🏪",

            location:location,

            category:category,

            rating:"★★★★★ Yangi",

            phone:phone,

            description:
                description ||
                "Biznes haqida ma’lumot hozircha kiritilmagan."

        };


        businesses.unshift(
            newBusiness
        );


        showPopular();


        businessForm.reset();


        formMessage.style.display =
            "block";


        setTimeout(
            function(){

                formMessage.style.display =
                    "none";

                addBusinessModal.style.display =
                    "none";

            },
            1200
        );

    }
);


/* =========================
   MODAL TASHQARISIGA BOSISH
========================= */

window.addEventListener(
    "click",
    function(event){

        if(
            event.target ===
            businessModal
        ){

            businessModal.style.display =
                "none";

        }


        if(
            event.target ===
            addBusinessModal
        ){

            addBusinessModal.style.display =
                "none";

        }

    }
);


/* =========================
   BOSHLANG‘ICH HOLAT
========================= */

showPopular();

</script>

</body>
</html>
