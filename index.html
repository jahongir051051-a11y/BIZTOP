<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BIZTOP — Eng yaxshi bizneslarni toping</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html {
    width: 100%;
    overflow-x: hidden;
}

body {
    width: 100%;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: #061b41;
    color: white;
    overflow-x: hidden;
}

/* ================= HEADER ================= */

header {
    width: 100%;
    border-bottom: 3px solid #2388ff;
    background: #061b41;
}

.header-inner {
    width: 100%;
    max-width: 1100px;
    margin: auto;
    padding: 16px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
}

.logo {
    font-size: 42px;
    font-weight: 900;
    letter-spacing: -3px;
    white-space: nowrap;
}

.logo-blue {
    color: #258cff;
}

.logo-white {
    color: white;
}

.add-business {
    border: none;
    background: #258cff;
    color: white;
    font-size: 16px;
    font-weight: 700;
    padding: 14px 20px;
    border-radius: 18px;
    cursor: pointer;
}

/* ================= MAIN ================= */

.container {
    width: 100%;
    max-width: 1100px;
    margin: auto;
    padding: 50px 20px 70px;
}

/* ================= HERO ================= */

.hero {
    text-align: center;
    max-width: 850px;
    margin: 0 auto 55px;
}

.hero h1 {
    font-size: 64px;
    line-height: 1.05;
    font-weight: 900;
    margin-bottom: 25px;
}

.hero h1 span {
    color: #258cff;
}

.hero p {
    color: #b7c9e8;
    font-size: 23px;
    line-height: 1.5;
    margin-bottom: 35px;
}

/* ================= SEARCH ================= */

.search-area {
    width: 100%;
    max-width: 700px;
    margin: auto;
}

.search-input {
    width: 100%;
    height: 70px;
    border: none;
    outline: none;
    border-radius: 25px;
    padding: 0 25px;
    font-size: 19px;
    background: white;
    color: #111;
}

.search-button {
    width: 100%;
    height: 65px;
    margin-top: 15px;
    border: none;
    border-radius: 22px;
    background: #258cff;
    color: white;
    font-size: 23px;
    font-weight: 800;
    cursor: pointer;
}

.search-button:active {
    transform: scale(0.98);
}

/* ================= SECTION ================= */

.section-title {
    font-size: 42px;
    font-weight: 900;
    margin-bottom: 25px;
}

.hidden {
    display: none !important;
}

/* ================= RESULTS ================= */

.results {
    margin-bottom: 60px;
}

.business-card {
    width: 100%;
    background: #204b7e;
    border: 3px solid #267bd1;
    border-radius: 28px;
    padding: 28px;
    margin-bottom: 20px;
}

.business-top {
    display: flex;
    align-items: center;
    gap: 18px;
    margin-bottom: 20px;
}

.business-icon {
    font-size: 52px;
    flex-shrink: 0;
}

.business-name {
    font-size: 30px;
    font-weight: 900;
}

.business-info {
    color: #c8d8ef;
    font-size: 18px;
    line-height: 1.8;
}

.rating {
    color: #ffd329;
    font-size: 24px;
    font-weight: 800;
    margin-top: 10px;
}

.profile-button {
    width: 100%;
    margin-top: 20px;
    padding: 17px;
    border: none;
    border-radius: 18px;
    background: #258cff;
    color: white;
    font-size: 18px;
    font-weight: 800;
    cursor: pointer;
}

/* ================= CATEGORIES ================= */

.categories {
    margin-top: 30px;
}

.category-grid {
    width: 100%;
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 18px;
}

.category {
    width: 100%;
    min-height: 170px;
    border: 3px solid #267bd1;
    border-radius: 25px;
    background: #204b7e;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    padding: 20px;
    transition: 0.2s;
}

.category:hover {
    transform: translateY(-3px);
    background: #28598f;
}

.category-icon {
    font-size: 55px;
    margin-bottom: 15px;
}

.category-name {
    font-size: 20px;
    font-weight: 800;
    text-align: center;
}

/* ================= MODAL ================= */

.modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 9999;
}

.modal.show {
    display: flex;
}

.modal-box {
    width: 100%;
    max-width: 550px;
    max-height: 90vh;
    overflow-y: auto;
    background: #204b7e;
    border: 3px solid #258cff;
    border-radius: 28px;
    padding: 30px;
    position: relative;
}

.close {
    position: absolute;
    right: 18px;
    top: 12px;
    font-size: 30px;
    cursor: pointer;
}

.modal-icon {
    text-align: center;
    font-size: 75px;
    margin-bottom: 10px;
}

.modal-title {
    text-align: center;
    font-size: 32px;
    font-weight: 900;
    margin-bottom: 10px;
}

.modal-category {
    text-align: center;
    color: #c8d8ef;
    font-size: 18px;
}

.modal-rating {
    text-align: center;
    color: #ffd329;
    font-size: 28px;
    font-weight: 900;
    margin: 15px 0 25px;
}

.info-box {
    background: #163b69;
    border: 2px solid #267bd1;
    border-radius: 20px;
    padding: 20px;
    margin-bottom: 15px;
}

.info-box h3 {
    font-size: 20px;
    margin-bottom: 10px;
}

.info-box p {
    color: #c8d8ef;
    font-size: 18px;
    line-height: 1.6;
}

.call-button {
    display: block;
    width: 100%;
    text-align: center;
    text-decoration: none;
    background: #258cff;
    color: white;
    padding: 17px;
    border-radius: 18px;
    font-size: 20px;
    font-weight: 800;
    margin: 20px 0;
}

/* ================= RATING ================= */

.rating-box {
    background: #163b69;
    border-radius: 22px;
    padding: 22px;
    text-align: center;
}

.rating-box h3 {
    font-size: 21px;
    margin-bottom: 15px;
}

.stars {
    display: flex;
    justify-content: center;
    gap: 8px;
}

.star {
    font-size: 42px;
    color: #6d83a5;
    cursor: pointer;
}

.star.active {
    color: #ffd329;
}

.rating-message {
    color: #c8d8ef;
    margin-top: 15px;
    font-size: 16px;
}

/* ================= ADD BUSINESS ================= */

.form-group {
    margin-bottom: 15px;
}

.form-group label {
    display: block;
    margin-bottom: 7px;
    font-weight: 700;
}

.form-group input,
.form-group select,
.form-group textarea {
    width: 100%;
    border: none;
    outline: none;
    border-radius: 14px;
    padding: 14px;
    font-size: 16px;
}

.form-group textarea {
    min-height: 100px;
    resize: vertical;
}

.submit-button {
    width: 100%;
    border: none;
    background: #258cff;
    color: white;
    padding: 16px;
    border-radius: 16px;
    font-size: 18px;
    font-weight: 800;
}

/* ================= MOBILE ================= */

@media (max-width: 600px) {

    .header-inner {
        padding: 12px 14px;
        gap: 8px;
    }

    .logo {
        font-size: 31px;
        letter-spacing: -2px;
    }

    .add-business {
        font-size: 13px;
        padding: 11px 13px;
        border-radius: 14px;
    }

    .container {
        padding: 32px 15px 50px;
    }

    .hero {
        margin-bottom: 40px;
    }

    .hero h1 {
        font-size: 39px;
        line-height: 1.08;
        margin-bottom: 18px;
    }

    .hero p {
        font-size: 17px;
        line-height: 1.45;
        margin-bottom: 25px;
    }

    .search-input {
        height: 58px;
        border-radius: 18px;
        padding: 0 17px;
        font-size: 16px;
    }

    .search-button {
        height: 55px;
        border-radius: 18px;
        font-size: 19px;
        margin-top: 10px;
    }

    .section-title {
        font-size: 31px;
        margin-bottom: 18px;
    }

    .business-card {
        padding: 20px;
        border-radius: 22px;
    }

    .business-top {
        gap: 12px;
    }

    .business-icon {
        font-size: 40px;
    }

    .business-name {
        font-size: 23px;
    }

    .business-info {
        font-size: 16px;
        line-height: 1.65;
    }

    .rating {
        font-size: 21px;
    }

    .profile-button {
        padding: 14px;
        font-size: 16px;
    }

    .category-grid {
        grid-template-columns: 1fr 1fr;
        gap: 12px;
    }

    .category {
        min-height: 140px;
        padding: 12px;
        border-radius: 20px;
    }

    .category-icon {
        font-size: 42px;
        margin-bottom: 10px;
    }

    .category-name {
        font-size: 16px;
    }

    .modal {
        padding: 12px;
    }

    .modal-box {
        padding: 22px 17px;
        border-radius: 22px;
    }

    .modal-icon {
        font-size: 60px;
    }

    .modal-title {
        font-size: 25px;
    }

    .modal-rating {
        font-size: 24px;
    }

    .star {
        font-size: 35px;
    }
}

/* Juda kichik telefonlar */

@media (max-width: 360px) {

    .logo {
        font-size: 27px;
    }

    .add-business {
        font-size: 11px;
        padding: 10px;
    }

    .hero h1 {
        font-size: 34px;
    }

    .category-grid {
        grid-template-columns: 1fr;
    }

    .category {
        min-height: 125px;
    }
}
</style>
</head>

<body>

<header>
    <div class="header-inner">

        <div class="logo">
            <span class="logo-blue">BIZ</span><span class="logo-white">TOP</span>
        </div>

        <button class="add-business" onclick="openAddBusiness()">
            ➕ Biznes qo‘shish
        </button>

    </div>
</header>

<main class="container">

    <!-- HERO -->

    <section class="hero">

        <h1>
            Eng yaxshi
            <span>bizneslarni</span>
            toping
        </h1>

        <p>
            BIZTOP — bizneslarni topish,
            baholash va tanlash platformasi.
        </p>

        <div class="search-area">

            <input
                id="searchInput"
                class="search-input"
                type="text"
                placeholder="Restoran, kafe, do‘kon yoki boshqasi..."
                onkeydown="if(event.key === 'Enter') searchBusinesses()"
            >

            <button class="search-button" onclick="searchBusinesses()">
                🔎 Qidirish
            </button>

        </div>

    </section>

    <!-- RESULTS -->

    <section id="resultsSection" class="results hidden">

        <h2 class="section-title">
            🔎 Qidiruv natijalari
        </h2>

        <div id="results"></div>

    </section>

    <!-- CATEGORIES -->

    <section class="categories">

        <h2 class="section-title">
            Kategoriyalar
        </h2>

        <div class="category-grid">

            <div class="category" onclick="searchCategory('Restoran')">
                <div class="category-icon">🍽️</div>
                <div class="category-name">Restoran</div>
            </div>

            <div class="category" onclick="searchCategory('Kafe')">
                <div class="category-icon">☕</div>
                <div class="category-name">Kafe</div>
            </div>

            <div class="category" onclick="searchCategory('Do‘kon')">
                <div class="category-icon">🛒</div>
                <div class="category-name">Do‘kon</div>
            </div>

            <div class="category" onclick="searchCategory('Kiyim-kechak')">
                <div class="category-icon">👕</div>
                <div class="category-name">Kiyim-kechak</div>
            </div>

            <div class="category" onclick="searchCategory('Mehmonxona')">
                <div class="category-icon">🏨</div>
                <div class="category-name">Mehmonxona</div>
            </div>

            <div class="category" onclick="searchCategory('Avtoservis')">
                <div class="category-icon">🚗</div>
                <div class="category-name">Avtoservis</div>
            </div>

        </div>

    </section>

</main>

<!-- ================= PROFILE MODAL ================= -->

<div id="profileModal" class="modal">

    <div class="modal-box">

        <div class="close" onclick="closeModal()">
            ✕
        </div>

        <div id="modalContent"></div>

    </div>

</div>

<!-- ================= ADD BUSINESS MODAL ================= -->

<div id="addBusinessModal" class="modal">

    <div class="modal-box">

        <div class="close" onclick="closeAddBusiness()">
            ✕
        </div>

        <h2 class="modal-title">
            Biznes qo‘shish
        </h2>

        <br>

        <div class="form-group">
            <label>Biznes nomi</label>
            <input id="newName" placeholder="Masalan: BIZTOP Burger">
        </div>

        <div class="form-group">
            <label>Kategoriya</label>

            <select id="newCategory">
                <option>Restoran</option>
                <option>Kafe</option>
                <option>Do‘kon</option>
                <option>Kiyim-kechak</option>
                <option>Mehmonxona</option>
                <option>Avtoservis</option>
            </select>
        </div>

        <div class="form-group">
            <label>Manzil</label>
            <input id="newAddress" placeholder="Masalan: To‘rtko‘l">
        </div>

        <div class="form-group">
            <label>Telefon</label>
            <input id="newPhone" placeholder="+998 90 123 45 67">
        </div>

        <div class="form-group">
            <label>Biznes haqida</label>
            <textarea id="newDescription"
                placeholder="Biznesingiz haqida qisqacha yozing..."></textarea>
        </div>

        <button class="submit-button" onclick="addBusiness()">
            Biznesni qo‘shish
        </button>

    </div>

</div>

<script>

/* ================= DATA ================= */

let businesses = [

    {
        id: 1,
        name: "BIZTOP Burger",
        category: "Restoran",
        address: "To‘rtko‘l",
        phone: "+998 90 111 11 11",
        description: "Mazali burger va tez tayyorlanadigan taomlar.",
        rating: 4.9,
        icon: "🍔"
    },

    {
        id: 2,
        name: "BIZTOP Cafe",
        category: "Kafe",
        address: "To‘rtko‘l",
        phone: "+998 90 222 22 22",
        description: "Mazali qahva va shirinliklar.",
        rating: 4.7,
        icon: "☕"
    },

    {
        id: 3,
        name: "BIZTOP Market",
        category: "Do‘kon",
        address: "To‘rtko‘l",
        phone: "+998 90 333 33 33",
        description: "Kundalik mahsulotlar va oziq-ovqat.",
        rating: 4.6,
        icon: "🛒"
    }

];

/* ================= SEARCH ================= */

function searchBusinesses() {

    const input =
        document.getElementById("searchInput")
        .value
        .trim()
        .toLowerCase();

    if (!input) {

        document.getElementById("resultsSection")
            .classList.add("hidden");

        return;
    }

    const found = businesses.filter(function(business) {

        return (
            business.name.toLowerCase().includes(input) ||
            business.category.toLowerCase().includes(input) ||
            business.address.toLowerCase().includes(input) ||
            business.description.toLowerCase().includes(input)
        );

    });

    showResults(found);

}

/* ================= CATEGORY ================= */

function searchCategory(category) {

    document.getElementById("searchInput").value = category;

    const found = businesses.filter(function(business) {

        return business.category === category;

    });

    showResults(found);

}

/* ================= SHOW RESULTS ================= */

function showResults(list) {

    const section =
        document.getElementById("resultsSection");

    const results =
        document.getElementById("results");

    section.classList.remove("hidden");

    if (list.length === 0) {

        results.innerHTML = `
            <div class="business-card">
                <h3 style="font-size:22px;">
                    😔 Biznes topilmadi
                </h3>

                <p class="business-info" style="margin-top:10px;">
                    Boshqa so‘z bilan qidirib ko‘ring.
                </p>
            </div>
        `;

        section.scrollIntoView({
            behavior: "smooth",
            block: "start"
        });

        return;
    }

    results.innerHTML = list.map(function(business) {

        return `

            <div class="business-card">

                <div class="business-top">

                    <div class="business-icon">
                        ${business.icon}
                    </div>

                    <div class="business-name">
                        ${business.name}
                    </div>

                </div>

                <div class="business-info">
                    📂 ${business.category}<br>
                    📍 ${business.address}<br>
                    📞 ${business.phone}
                </div>

                <div class="rating">
                    ⭐ ${business.rating.toFixed(1)}
                </div>

                <button
                    class="profile-button"
                    onclick="openProfile(${business.id})"
                >
                    👁️ Biznes profilini ko‘rish
                </button>

            </div>

        `;

    }).join("");

    section.scrollIntoView({
        behavior: "smooth",
        block: "start"
    });

}

/* ================= PROFILE ================= */

function openProfile(id) {

    const business =
        businesses.find(function(item) {
            return item.id === id;
        });

    if (!business) return;

    const modal =
        document.getElementById("profileModal");

    const content =
        document.getElementById("modalContent");

    content.innerHTML = `

        <div class="modal-icon">
            ${business.icon}
        </div>

        <div class="modal-title">
            ${business.name}
        </div>

        <div class="modal-category">
            🍽️ ${business.category}
        </div>

        <div class="modal-rating">
            ⭐ ${business.rating.toFixed(1)}
        </div>

        <div class="info-box">

            <h3>📍 Manzil</h3>

            <p>
                ${business.address}
            </p>

        </div>

        <div class="info-box">

            <h3>📞 Telefon</h3>

            <p>
                ${business.phone}
            </p>

        </div>

        <div class="info-box">

            <h3>📝 Biznes haqida</h3>

            <p>
                ${business.description}
            </p>

        </div>

        <a
            class="call-button"
            href="tel:${business.phone.replace(/\s/g,'')}"
        >
            📞 Telefon qilish
        </a>

        <div class="rating-box">

            <h3>
                ⭐ Biznesni baholang
            </h3>

            <div class="stars">

                <span class="star"
                    onclick="rateBusiness(${business.id},1)">★</span>

                <span class="star"
                    onclick="rateBusiness(${business.id},2)">★</span>

                <span class="star"
                    onclick="rateBusiness(${business.id},3)">★</span>

                <span class="star"
                    onclick="rateBusiness(${business.id},4)">★</span>

                <span class="star"
                    onclick="rateBusiness(${business.id},5)">★</span>

            </div>

            <div id="ratingMessage"
                 class="rating-message">
                Baho berish uchun yulduzni bosing
            </div>

        </div>

    `;

    modal.classList.add("show");

}

/* ================= RATE ================= */

function rateBusiness(id, score) {

    const business =
        businesses.find(function(item) {
            return item.id === id;
        });

    if (!business) return;

    business.rating = score;

    const stars =
        document.querySelectorAll(".star");

    stars.forEach(function(star, index) {

        if (index < score) {
            star.classList.add("active");
        } else {
            star.classList.remove("active");
        }

    });

    document.getElementById("ratingMessage").innerHTML =
        `✅ Siz ${score} yulduz baho berdingiz`;

}

/* ================= CLOSE PROFILE ================= */

function closeModal() {

    document
        .getElementById("profileModal")
        .classList.remove("show");

}

/* ================= ADD BUSINESS ================= */

function openAddBusiness() {

    document
        .getElementById("addBusinessModal")
        .classList.add("show");

}

function closeAddBusiness() {

    document
        .getElementById("addBusinessModal")
        .classList.remove("show");

}

function addBusiness() {

    const name =
        document.getElementById("newName").value.trim();

    const category =
        document.getElementById("newCategory").value;

    const address =
        document.getElementById("newAddress").value.trim();

    const phone =
        document.getElementById("newPhone").value.trim();

    const description =
        document.getElementById("newDescription").value.trim();

    if (!name || !address || !phone) {

        alert("Iltimos, biznes nomi, manzil va telefonni kiriting.");

        return;
    }

    const icons = {
        "Restoran": "🍽️",
        "Kafe": "☕",
        "Do‘kon": "🛒",
        "Kiyim-kechak": "👕",
        "Mehmonxona": "🏨",
        "Avtoservis": "🚗"
    };

    businesses.push({

        id: Date.now(),

        name: name,

        category: category,

        address: address,

        phone: phone,

        description:
            description || "Biznes haqida ma'lumot.",

        rating: 0,

        icon: icons[category] || "🏪"

    });

    closeAddBusiness();

    document.getElementById("newName").value = "";
    document.getElementById("newAddress").value = "";
    document.getElementById("newPhone").value = "";
    document.getElementById("newDescription").value = "";

    alert("✅ Biznes muvaffaqiyatli qo‘shildi!");

}

/* ================= MODAL OUTSIDE CLICK ================= */

window.addEventListener("click", function(event) {

    const profileModal =
        document.getElementById("profileModal");

    const addModal =
        document.getElementById("addBusinessModal");

    if (event.target === profileModal) {
        closeModal();
    }

    if (event.target === addModal) {
        closeAddBusiness();
    }

});

</script>

</body>
</html>
