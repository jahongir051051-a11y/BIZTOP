<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BIZTOP — Eng yaxshi bizneslar</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    background:#061b41;
    color:white;
    overflow-x:hidden;
}

button,
input,
select,
textarea{
    font:inherit;
}

button{
    cursor:pointer;
}

/* HEADER */

header{
    width:100%;
    padding:18px 24px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:4px solid #1685ff;
    background:#061b41;
    position:sticky;
    top:0;
    z-index:100;
}

.logo{
    font-size:42px;
    font-weight:900;
    letter-spacing:-3px;
}

.logo span{
    color:#1685ff;
}

.add-business-btn{
    border:none;
    background:#1685ff;
    color:white;
    padding:15px 22px;
    border-radius:25px;
    font-weight:800;
    font-size:16px;
}

/* MAIN */

.container{
    width:min(1100px, 92%);
    margin:auto;
}

.hero{
    text-align:center;
    padding:70px 10px 45px;
}

.hero h1{
    font-size:clamp(44px, 8vw, 78px);
    line-height:1.03;
    font-weight:900;
}

.hero h1 .blue{
    color:#1685ff;
}

.hero p{
    margin:30px auto;
    max-width:750px;
    font-size:clamp(20px, 3vw, 28px);
    line-height:1.5;
    color:#b8c9e8;
}

/* SEARCH */

.search-area{
    max-width:760px;
    margin:auto;
}

.search-input{
    width:100%;
    border:none;
    outline:none;
    background:white;
    color:#222;
    padding:24px 30px;
    border-radius:35px;
    font-size:22px;
}

.search-btn{
    width:100%;
    margin-top:16px;
    border:none;
    background:#1685ff;
    color:white;
    padding:22px;
    border-radius:32px;
    font-size:25px;
    font-weight:900;
}

.search-btn:active{
    transform:scale(.98);
}

/* SECTION */

.section{
    padding:45px 0;
}

.section-title{
    font-size:clamp(38px, 7vw, 60px);
    font-weight:900;
    margin-bottom:30px;
}

/* RESULTS */

.results{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:22px;
}

.business-card{
    background:#214d82;
    border:4px solid #1678e8;
    border-radius:30px;
    padding:28px;
    box-shadow:0 8px 20px rgba(0,0,0,.18);
}

.business-card h3{
    font-size:30px;
    margin-bottom:14px;
}

.business-info{
    color:#c8d7ee;
    font-size:20px;
    line-height:1.7;
}

.rating{
    color:#ffd21c;
    font-size:25px;
    font-weight:900;
    margin:15px 0;
}

.profile-btn{
    width:100%;
    border:none;
    background:#1685ff;
    color:white;
    padding:17px;
    border-radius:22px;
    font-size:18px;
    font-weight:900;
}

/* CATEGORIES */

.categories{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:18px;
}

.category{
    min-height:180px;
    border:4px solid #1678e8;
    border-radius:28px;
    background:#214d82;
    color:white;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:20px 10px;
    font-size:20px;
    font-weight:900;
    transition:.2s;
}

.category:hover{
    transform:translateY(-4px);
}

.category-icon{
    font-size:55px;
    margin-bottom:15px;
}

/* EMPTY */

.empty{
    background:#102f5c;
    border-radius:25px;
    padding:30px;
    text-align:center;
    color:#b9cbea;
    font-size:20px;
}

/* MODAL */

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.72);
    z-index:1000;
    overflow-y:auto;
    padding:25px 15px;
}

.modal.show{
    display:block;
}

.modal-box{
    width:min(650px,100%);
    margin:20px auto;
    background:#285b95;
    border:4px solid #1685ff;
    border-radius:30px;
    padding:28px;
    position:relative;
}

.close{
    position:absolute;
    right:20px;
    top:15px;
    background:none;
    border:none;
    color:white;
    font-size:35px;
}

.modal-title{
    text-align:center;
    font-size:35px;
    font-weight:900;
    margin:20px 0 25px;
}

.profile-icon{
    text-align:center;
    font-size:90px;
    margin-bottom:10px;
}

.profile-name{
    text-align:center;
    font-size:38px;
    font-weight:900;
}

.profile-category{
    text-align:center;
    color:#cbd9ee;
    font-size:22px;
    margin:10px;
}

.profile-rating{
    text-align:center;
    color:#ffd21c;
    font-size:40px;
    font-weight:900;
    margin:10px 0 25px;
}

.info-box{
    background:#163b6d;
    border-radius:25px;
    padding:25px;
    margin:18px 0;
}

.info-box h3{
    font-size:25px;
    margin-bottom:12px;
}

.info-box p{
    color:#c8d7ee;
    font-size:21px;
    line-height:1.7;
}

.call-btn{
    display:block;
    width:100%;
    text-align:center;
    text-decoration:none;
    background:#1685ff;
    color:white;
    padding:20px;
    border-radius:24px;
    font-size:22px;
    font-weight:900;
    margin:20px 0;
}

/* RATE */

.rate-box{
    background:#163b6d;
    border-radius:25px;
    padding:25px;
    text-align:center;
}

.rate-box h3{
    font-size:25px;
    margin-bottom:20px;
}

.stars{
    display:flex;
    justify-content:center;
    gap:8px;
}

.star{
    border:none;
    background:none;
    color:#647fa6;
    font-size:45px;
    padding:0;
}

.star.active{
    color:#ffd21c;
}

.rate-message{
    color:#c8d7ee;
    margin-top:18px;
    font-size:18px;
}

/* FORM */

.form-group{
    margin-bottom:18px;
}

.form-group label{
    display:block;
    margin-bottom:8px;
    font-weight:800;
}

.form-group input,
.form-group select,
.form-group textarea{
    width:100%;
    border:none;
    outline:none;
    border-radius:16px;
    padding:16px;
    font-size:17px;
}

.form-group textarea{
    min-height:120px;
    resize:vertical;
}

.submit-btn{
    width:100%;
    border:none;
    background:#1685ff;
    color:white;
    padding:18px;
    border-radius:20px;
    font-size:20px;
    font-weight:900;
}

/* FOOTER */

footer{
    text-align:center;
    padding:50px 20px;
    color:#9db3d7;
}

/* MOBILE */

@media(max-width:800px){

    header{
        padding:14px 16px;
    }

    .logo{
        font-size:34px;
    }

    .add-business-btn{
        padding:12px 15px;
        font-size:14px;
    }

    .hero{
        padding-top:55px;
    }

    .hero p{
        margin:22px auto;
    }

    .search-input{
        padding:21px 24px;
        font-size:19px;
    }

    .search-btn{
        padding:19px;
        font-size:22px;
    }

    .categories{
        grid-template-columns:repeat(2,1fr);
        gap:14px;
    }

    .category{
        min-height:155px;
        font-size:18px;
    }

    .category-icon{
        font-size:45px;
    }

    .business-card{
        padding:22px;
    }

    .business-card h3{
        font-size:27px;
    }

    .modal{
        padding:10px;
    }

    .modal-box{
        margin:10px auto;
        padding:22px 18px;
    }

    .profile-name{
        font-size:32px;
    }

    .profile-icon{
        font-size:75px;
    }
}

@media(max-width:450px){

    .container{
        width:90%;
    }

    header{
        position:relative;
    }

    .logo{
        font-size:30px;
    }

    .add-business-btn{
        font-size:12px;
        padding:10px 12px;
    }

    .hero{
        padding-top:40px;
    }

    .categories{
        grid-template-columns:repeat(2,1fr);
    }

    .category{
        min-height:145px;
        padding:12px 5px;
    }

    .category-icon{
        font-size:40px;
    }

    .section{
        padding:35px 0;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">
        <span>BIZ</span>TOP
    </div>

    <button class="add-business-btn" onclick="openAddBusiness()">
        ➕ Biznes qo‘shish
    </button>
</header>

<main class="container">

<section class="hero">

    <h1>
        Eng yaxshi<br>
        <span class="blue">bizneslarni</span><br>
        toping
    </h1>

    <p>
        BIZTOP — bizneslarni topish,<br>
        baholash va tanlash platformasi.
    </p>

    <div class="search-area">

        <input
            id="searchInput"
            class="search-input"
            type="text"
            placeholder="Restoran, kafe, do‘kon yoki boshqasini qidiring..."
            onkeydown="if(event.key==='Enter') searchBusinesses()"
        >

        <button class="search-btn" onclick="searchBusinesses()">
            🔎 Qidirish
        </button>

    </div>

</section>

<section class="section">

    <h2 class="section-title">
        🔎 Qidiruv natijalari
    </h2>

    <div id="results" class="results"></div>

</section>

<section class="section">

    <h2 class="section-title">
        Kategoriyalar
    </h2>

    <div id="categories" class="categories"></div>

</section>

</main>

<footer>
    © 2026 BIZTOP — Eng yaxshi bizneslarni toping
</footer>


<!-- PROFILE MODAL -->

<div id="profileModal" class="modal">

    <div class="modal-box">

        <button class="close" onclick="closeProfile()">×</button>

        <div id="profileContent"></div>

    </div>

</div>


<!-- ADD BUSINESS MODAL -->

<div id="addModal" class="modal">

    <div class="modal-box">

        <button class="close" onclick="closeAddBusiness()">×</button>

        <h2 class="modal-title">
            ➕ Biznes qo‘shish
        </h2>

        <form id="businessForm">

            <div class="form-group">
                <label>Biznes nomi</label>
                <input
                    id="businessName"
                    type="text"
                    placeholder="Masalan: BIZTOP Cafe"
                    required
                >
            </div>

            <div class="form-group">
                <label>Kategoriya</label>

                <select id="businessCategory" required>
                    <option value="">Kategoriyani tanlang</option>
                </select>

            </div>

            <div class="form-group">
                <label>Manzil</label>

                <input
                    id="businessAddress"
                    type="text"
                    placeholder="Masalan: To‘rtko‘l"
                    required
                >

            </div>

            <div class="form-group">
                <label>Telefon</label>

                <input
                    id="businessPhone"
                    type="tel"
                    placeholder="+998 90 123 45 67"
                    required
                >

            </div>

            <div class="form-group">
                <label>Biznes haqida</label>

                <textarea
                    id="businessDescription"
                    placeholder="Biznesingiz haqida qisqacha..."
                    required
                ></textarea>

            </div>

            <button class="submit-btn" type="submit">
                🚀 Biznesni qo‘shish
            </button>

        </form>

    </div>

</div>


<script>

/* =========================
   KATEGORIYALAR
========================= */

const categories = [

    {name:"Restoran", icon:"🍽️"},
    {name:"Kafe", icon:"☕"},
    {name:"Do‘kon", icon:"🛒"},
    {name:"Kiyim-kechak", icon:"👕"},
    {name:"Avtoservis", icon:"🔧"},
    {name:"Mehmonxona", icon:"🏨"},
    {name:"Sartaroshxona", icon:"💇"},
    {name:"Go‘zallik saloni", icon:"💅"},
    {name:"Qurilish", icon:"🏗️"},
    {name:"IT / Kompyuter", icon:"💻"},
    {name:"Dorixona", icon:"💊"},
    {name:"Nonvoyxona", icon:"🥖"},
    {name:"Sport / Fitness", icon:"🏋️"},
    {name:"O‘quv markazi", icon:"📚"},
    {name:"Avto / Transport", icon:"🚗"},
    {name:"Boshqa", icon:"🏢"}

];


/* =========================
   BIZNESLAR
========================= */

let businesses = [

    {
        id:1,
        name:"BIZTOP Burger",
        category:"Restoran",
        address:"To‘rtko‘l",
        phone:"+998 90 111 11 11",
        description:"Mazali burger va tez tayyorlanadigan taomlar.",
        rating:4.9,
        icon:"🍔",
        votes:0
    }

];


/* =========================
   LOCAL STORAGE
========================= */

const savedBusinesses =
    localStorage.getItem("biztopBusinesses");

if(savedBusinesses){

    try{

        const parsed =
            JSON.parse(savedBusinesses);

        if(Array.isArray(parsed)){
            businesses = parsed;
        }

    }catch(e){

        console.log("Storage xatosi");

    }

}


/* =========================
   KATEGORIYALARNI CHIQARISH
========================= */

function renderCategories(){

    const container =
        document.getElementById("categories");

    container.innerHTML = "";

    categories.forEach(category => {

        const button =
            document.createElement("button");

        button.className = "category";

        button.innerHTML = `
            <div class="category-icon">
                ${category.icon}
            </div>

            <div>
                ${category.name}
            </div>
        `;

        button.onclick = function(){

            searchByCategory(category.name);

        };

        container.appendChild(button);

    });


    /* FORM SELECT */

    const select =
        document.getElementById("businessCategory");

    select.innerHTML =
        `<option value="">Kategoriyani tanlang</option>`;

    categories.forEach(category => {

        const option =
            document.createElement("option");

        option.value = category.name;
        option.textContent =
            category.icon + " " + category.name;

        select.appendChild(option);

    });

}


/* =========================
   BIZNES KARTALARI
========================= */

function renderBusinesses(list){

    const results =
        document.getElementById("results");

    results.innerHTML = "";

    if(!list.length){

        results.innerHTML = `
            <div class="empty">
                😔 Bu qidiruv bo‘yicha biznes topilmadi.
                <br><br>
                Boshqa so‘z bilan qidirib ko‘ring.
            </div>
        `;

        return;

    }


    list.forEach(business => {

        const card =
            document.createElement("div");

        card.className = "business-card";

        card.innerHTML = `

            <h3>
                ${business.icon || "🏢"}
                ${business.name}
            </h3>

            <div class="business-info">
                📁 ${business.category}<br>
                📍 ${business.address}<br>
                📞 ${business.phone}
            </div>

            <div class="rating">
                ⭐ ${Number(business.rating).toFixed(1)}
            </div>

            <button
                class="profile-btn"
                onclick="openProfile(${business.id})"
            >
                👁️ Biznes profilini ko‘rish
            </button>

        `;

        results.appendChild(card);

    });

}


/* =========================
   QIDIRUV
========================= */

function searchBusinesses(){

    const input =
        document.getElementById("searchInput");

    const query =
        input.value.trim().toLowerCase();

    if(!query){

        renderBusinesses(businesses);

        document
            .getElementById("results")
            .scrollIntoView({
                behavior:"smooth"
            });

        return;

    }


    const filtered =
        businesses.filter(business => {

            return (

                business.name
                    .toLowerCase()
                    .includes(query)

                ||

                business.category
                    .toLowerCase()
                    .includes(query)

                ||

                business.address
                    .toLowerCase()
                    .includes(query)

                ||

                business.description
                    .toLowerCase()
                    .includes(query)

            );

        });


    renderBusinesses(filtered);

    document
        .getElementById("results")
        .scrollIntoView({
            behavior:"smooth"
        });

}


/* =========================
   KATEGORIYA BO‘YICHA
========================= */

function searchByCategory(category){

    document
        .getElementById("searchInput")
        .value = category;

    const filtered =
        businesses.filter(
            business =>
                business.category === category
        );

    renderBusinesses(filtered);

    document
        .getElementById("results")
        .scrollIntoView({
            behavior:"smooth"
        });

}


/* =========================
   PROFILNI OCHISH
========================= */

function openProfile(id){

    const business =
        businesses.find(
            item => item.id === id
        );

    if(!business) return;


    const modal =
        document.getElementById("profileModal");

    const content =
        document.getElementById("profileContent");


    content.innerHTML = `

        <div class="profile-icon">
            ${business.icon || "🏢"}
        </div>

        <div class="profile-name">
            ${business.name}
        </div>

        <div class="profile-category">
            📁 ${business.category}
        </div>

        <div class="profile-rating">
            ⭐ ${Number(business.rating).toFixed(1)}
        </div>


        <div class="info-box">

            <h3>📍 Manzil</h3>

            <p>
                ${business.address}
            </p>

            <p>
                📞 ${business.phone}
            </p>

        </div>


        <div class="info-box">

            <h3>📝 Biznes haqida</h3>

            <p>
                ${business.description}
            </p>

        </div>


        <a
            class="call-btn"
            href="tel:${business.phone.replace(/\s/g,'')}"
        >
            📞 Telefon qilish
        </a>


        <div class="rate-box">

            <h3>
                ⭐ Biznesni baholang
            </h3>

            <div class="stars">

                ${[1,2,3,4,5].map(star => `

                    <button
                        class="star"
                        onclick="rateBusiness(${business.id},${star})"
                    >
                        ★
                    </button>

                `).join("")}

            </div>

            <div
                id="rateMessage"
                class="rate-message"
            >
                Baho berish uchun yulduzni bosing
            </div>

        </div>

    `;


    modal.classList.add("show");

}


/* =========================
   PROFILNI YOPISH
========================= */

function closeProfile(){

    document
        .getElementById("profileModal")
        .classList.remove("show");

}


/* =========================
   BAHOLASH
========================= */

function rateBusiness(id, stars){

    const business =
        businesses.find(
            item => item.id === id
        );

    if(!business) return;


    /*
       Demo uchun reytingni
       yangi baho bilan
       o‘rtacha hisoblaymiz.
    */

    const oldRating =
        Number(business.rating);

    const oldVotes =
        Number(business.votes || 0);


    const newVotes =
        oldVotes + 1;

    const newRating =
        ((oldRating * oldVotes) + stars)
        / newVotes;


    business.rating =
        Math.min(5, Math.max(1,newRating));

    business.votes =
        newVotes;


    localStorage.setItem(
        "biztopBusinesses",
        JSON.stringify(businesses)
    );


    const message =
        document.getElementById("rateMessage");


    if(message){

        message.innerHTML =
            `✅ Siz ${stars} yulduz baho berdingiz`;

    }


    openProfile(id);

    renderBusinesses(businesses);

}


/* =========================
   ADD BUSINESS
========================= */

function openAddBusiness(){

    document
        .getElementById("addModal")
        .classList.add("show");

}


function closeAddBusiness(){

    document
        .getElementById("addModal")
        .classList.remove("show");

}


/* =========================
   FORM
========================= */

document
    .getElementById("businessForm")
    .addEventListener("submit", function(event){

        event.preventDefault();


        const name =
            document
                .getElementById("businessName")
                .value
                .trim();

        const category =
            document
                .getElementById("businessCategory")
                .value;

        const address =
            document
                .getElementById("businessAddress")
                .value
                .trim();

        const phone =
            document
                .getElementById("businessPhone")
                .value
                .trim();

        const description =
            document
                .getElementById("businessDescription")
                .value
                .trim();


        if(
            !name ||
            !category ||
            !address ||
            !phone ||
            !description
        ){

            alert("Iltimos, barcha maydonlarni to‘ldiring.");

            return;

        }


        const categoryData =
            categories.find(
                item => item.name === category
            );


        const newBusiness = {

            id:
                Date.now(),

            name:name,

            category:category,

            address:address,

            phone:phone,

            description:description,

            rating:0,

            votes:0,

            icon:
                categoryData
                    ? categoryData.icon
                    : "🏢"

        };


        businesses.push(newBusiness);


        localStorage.setItem(
            "biztopBusinesses",
            JSON.stringify(businesses)
        );


        document
            .getElementById("businessForm")
            .reset();


        closeAddBusiness();


        renderBusinesses(businesses);


        alert(
            "✅ Biznes muvaffaqiyatli qo‘shildi!"
        );


        document
            .getElementById("results")
            .scrollIntoView({
                behavior:"smooth"
            });

    });


/* =========================
   MODAL TASHQARISIGA BOSILSA YOPISH
========================= */

window.addEventListener("click", function(event){

    const profileModal =
        document.getElementById("profileModal");

    const addModal =
        document.getElementById("addModal");


    if(event.target === profileModal){

        closeProfile();

    }


    if(event.target === addModal){

        closeAddBusiness();

    }

});


/* =========================
   START
========================= */

renderCategories();

renderBusinesses(businesses);

</script>

</body>
</html>
